# Postconditions checked by the independent verifier after an action succeeds.
# Thresholds are initial lab values; calibrate against measured baselines and
# record changes in version history (benchmark.md §3).
# A key "<action_type>:<target_id>" applies to that target only and takes
# precedence over a plain "<action_type>" key; an action with neither has no
# spec and verifies as UNKNOWN (never PASSED).
schema_version: 1
specs:
  resume_test_consumer:
    lag_max: 100
    observation_window_seconds: 60
    sample_min_count: 5
    recovery_timeout_seconds: 240
    poll_interval_seconds: 10

  release_lab_db_blocker:
    observation_window_seconds: 60
    sample_min_count: 5
    recovery_timeout_seconds: 240
    poll_interval_seconds: 10
    checks:
      # The receipt's revision_after names the database without a blocker.
      - {kind: target_revision, check_id: blocker_released, target_id: lab-postgres}
      - {kind: metric_max, check_id: no_exclusive_locks, template_id: postgres_exclusive_locks,
         service_id: lab-postgres, bound: 0}
      - {kind: metric_max, check_id: api_errors_recovered, template_id: api_error_ratio,
         service_id: lab-api, bound: 0.02}
      - {kind: metric_max, check_id: api_latency_recovered, template_id: api_latency_p95,
         service_id: lab-api, bound: 0.5}

  restart_lab_dependency:lab-redis:
    observation_window_seconds: 60
    sample_min_count: 5
    recovery_timeout_seconds: 240
    poll_interval_seconds: 10
    checks:
      - {kind: target_revision, check_id: dependency_restarted, target_id: lab-redis}
      - {kind: metric_min, check_id: redis_up, template_id: redis_up,
         service_id: lab-redis, bound: 1}
      - {kind: metric_max, check_id: api_errors_recovered, template_id: api_error_ratio,
         service_id: lab-api, bound: 0.02}

  restart_lab_dependency:lab-kafka:
    observation_window_seconds: 60
    sample_min_count: 5
    recovery_timeout_seconds: 240
    poll_interval_seconds: 10
    checks:
      - {kind: target_revision, check_id: dependency_restarted, target_id: lab-kafka}
      - {kind: metric_min, check_id: broker_visible, template_id: kafka_broker_count,
         service_id: lab-kafka, bound: 1}
      - {kind: metric_min, check_id: producer_sending, template_id: producer_send_rate,
         service_id: demo-producer, bound: 1}

  restart_lab_dependency:lab-postgres:
    observation_window_seconds: 60
    sample_min_count: 5
    recovery_timeout_seconds: 240
    poll_interval_seconds: 10
    checks:
      - {kind: target_revision, check_id: dependency_restarted, target_id: lab-postgres}
      - {kind: metric_min, check_id: postgres_up, template_id: postgres_up,
         service_id: lab-postgres, bound: 1}
      - {kind: metric_max, check_id: api_errors_recovered, template_id: api_error_ratio,
         service_id: lab-api, bound: 0.02}

  rollback_demo_api:
    observation_window_seconds: 90
    sample_min_count: 6
    recovery_timeout_seconds: 300
    poll_interval_seconds: 10
    checks:
      - {kind: target_revision, check_id: pinned_release_running, target_id: lab-api,
         equals: rel-1}
      - {kind: metric_max, check_id: api_errors_recovered, template_id: api_error_ratio,
         service_id: lab-api, bound: 0.02}
      - {kind: metric_max, check_id: api_latency_recovered, template_id: api_latency_p95,
         service_id: lab-api, bound: 0.5}
      # Memory must stop growing (freed memory is not always returned to the OS).
      - {kind: metric_not_rising, check_id: memory_stable, template_id: api_memory_bytes,
         service_id: lab-api, bound: 10000000}

  stop_lab_cpu_load:
    observation_window_seconds: 60
    sample_min_count: 5
    recovery_timeout_seconds: 240
    poll_interval_seconds: 10
    checks:
      - {kind: target_revision, check_id: load_stopped, target_id: lab-cpu-load}
      - {kind: metric_max, check_id: api_cpu_recovered, template_id: api_cpu_cores,
         service_id: lab-api, bound: 0.4}
      - {kind: metric_max, check_id: api_latency_recovered, template_id: api_latency_p95,
         service_id: lab-api, bound: 0.5}

  reset_lab_load_profile:
    observation_window_seconds: 60
    sample_min_count: 5
    recovery_timeout_seconds: 240
    poll_interval_seconds: 10
    checks:
      - {kind: target_revision, check_id: load_profile_reset, target_id: lab-loadgen}
      - {kind: metric_max, check_id: request_rate_normal, template_id: api_request_rate_vs_baseline,
         service_id: lab-api, bound: 1.5}
      - {kind: metric_max, check_id: api_latency_recovered, template_id: api_latency_p95,
         service_id: lab-api, bound: 0.5}

  release_lab_idle_connections:
    observation_window_seconds: 60
    sample_min_count: 5
    recovery_timeout_seconds: 240
    poll_interval_seconds: 10
    checks:
      - {kind: target_revision, check_id: connections_released, target_id: lab-postgres}
      - {kind: metric_max, check_id: connection_headroom, template_id: postgres_connection_utilization,
         service_id: lab-postgres, bound: 0.5}
      - {kind: metric_max, check_id: api_errors_recovered, template_id: api_error_ratio,
         service_id: lab-api, bound: 0.02}

  revert_lab_config:
    observation_window_seconds: 60
    sample_min_count: 5
    recovery_timeout_seconds: 240
    poll_interval_seconds: 10
    checks:
      - {kind: target_revision, check_id: good_config_running, target_id: lab-api-config,
         equals: cfg-1}
      - {kind: metric_max, check_id: api_errors_recovered, template_id: api_error_ratio,
         service_id: lab-api, bound: 0.02}
