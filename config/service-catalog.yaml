# Versioned registry of every target IncidentOps may observe or act on.
# Network destinations live here (server-side), never in model arguments.
# depends_on lists what a service calls or uses ("A depends on B": B is
# upstream of A). co_located_with marks services sharing a runtime. Both only
# group incidents of one fault (ADR-030); tests/contract checks depends_on
# against the connection settings in fault-lab/compose.yaml.
schema_version: 1
catalog_version: c5
services:
  - service_id: persist-demo-consumer
    kind: kafka_consumer
    environment: fault-lab
    description: Controllable Kafka test consumer that persists demo events.
    management_url: http://lab-consumer:8081
    kafka:
      topic: demo.events.v1
      consumer_group: persist-demo-consumer
    allowed_actions: [resume_test_consumer]
    depends_on: [lab-kafka, lab-postgres]
  - service_id: demo-producer
    kind: kafka_producer
    environment: fault-lab
    description: Fixed-rate producer feeding demo.events.v1.
    kafka:
      topic: demo.events.v1
    allowed_actions: []
    depends_on: [lab-kafka]
  - service_id: lab-api
    kind: http_api
    environment: fault-lab
    description: Instrumented demo API backed by lab PostgreSQL and Redis; deployed as releases.
    # Deployments and rollbacks go through the lab deployment controller.
    management_url: http://fault-controller:8090
    allowed_actions: [rollback_demo_api]
    depends_on: [lab-postgres, lab-redis, lab-api-config]
  - service_id: lab-postgres
    kind: postgres
    environment: fault-lab
    description: Lab PostgreSQL used by lab-api and the consumer.
    management_url: http://fault-controller:8090
    allowed_actions: [release_lab_db_blocker, restart_lab_dependency, release_lab_idle_connections]
  - service_id: lab-redis
    kind: redis
    environment: fault-lab
    description: Lab Redis cache used by lab-api for every item request.
    management_url: http://fault-controller:8090
    allowed_actions: [restart_lab_dependency]
  - service_id: lab-cpu-load
    kind: load_generator
    environment: fault-lab
    description: Registered background load generator that runs inside lab-api.
    management_url: http://fault-controller:8090
    allowed_actions: [stop_lab_cpu_load]
    co_located_with: [lab-api]
  - service_id: lab-loadgen
    kind: load_generator
    environment: fault-lab
    description: Registered client workload that sends item requests to lab-api.
    management_url: http://fault-controller:8090
    allowed_actions: [reset_lab_load_profile]
    depends_on: [lab-api]
  - service_id: lab-api-config
    kind: config_store
    environment: fault-lab
    description: Versioned runtime configuration of lab-api, changed without a deploy.
    management_url: http://fault-controller:8090
    allowed_actions: [revert_lab_config]
  - service_id: lab-kafka
    kind: kafka_broker
    environment: fault-lab
    description: Single-node KRaft Kafka broker used by demo-producer and the consumer.
    # Restarts go through the lab controller like the other lab dependencies.
    management_url: http://fault-controller:8090
    allowed_actions: [restart_lab_dependency]
