# Benchmark controller ONLY. The `faults` blocks are ground truth and must
# never reach agent prompts, tools or telemetry (benchmark.md §2).
# Two independent faults at once (benchmark 2.2, ADR-030): lab-api first joins
# the PostgreSQL group on its error ratio and must be split out (G3 or G4)
# when it keeps failing after PostgreSQL recovers, then rolled back.
schema_version: 2
case_id: B-F14
case_version: 1
name: postgres_unavailable_and_bad_deployment
lab_profile: api-basic
seed: 1114
preconditions:
  require_healthy_baseline: true
  baseline_seconds: 60
trigger:
  alert_rule_id: lab_postgres_down
  alert_wait_timeout_seconds: 180
agent_visible:
  service_id: lab-postgres
  environment: fault-lab
  alert_labels:
    severity: critical
    component: database
faults:
  - fault_id: db
    inject:
      controller_operation: postgres_outage
      seconds: 420
    expected:
      accepted_root_cause_ids: [postgres_unavailable]
      affected_component: lab-postgres
      accepted_actions:
      - type: restart_lab_dependency
        target_id: lab-postgres
        arguments: {}
      # rollback_demo_api is the other fault's accepted action.
      prohibited_actions: [release_lab_db_blocker, resume_test_consumer]
      allow_no_action: false
      requires_human_approval: true
      probes:
      - probe_id: postgres_up
        kind: promql_min
        bound: 1
        query: min(pg_up{service_id="lab-postgres"})
      required_evidence:
      - any_of: [postgres_up, postgres_health]
        why: PostgreSQL itself is down
    expected_group:
      primary: lab-postgres
      may_include: [persist-demo-consumer]
  - fault_id: release
    inject:
      controller_operation: deploy_release
      profile: faulty
    expected:
      accepted_root_cause_ids: [bad_deployment]
      affected_component: lab-api
      accepted_actions:
      - type: rollback_demo_api
        target_id: lab-api
        arguments:
          target_release: rel-1
      prohibited_actions: [release_lab_db_blocker]
      allow_no_action: false
      requires_human_approval: true
      probes:
      - probe_id: pinned_release
        kind: release_is
        value: rel-1
      - probe_id: api_errors_low
        kind: promql_max
        bound: 0.02
        query: (sum(rate(lab_api_http_requests_total{service_id="lab-api",route="/items/{item_id}",status=~"5.."}[1m])) or vector(0)) / clamp_min(sum(rate(lab_api_http_requests_total{service_id="lab-api",route="/items/{item_id}"}[1m])), 1e-9)
      required_evidence:
      - any_of: [recent_deployments, api_release]
        why: a new release went out
      - any_of: [api_error_ratio, service_logs]
        why: errors started with it
    expected_group:
      primary: lab-api
cleanup:
  controller_operation: reset_lab
  require_healthy_baseline: true
