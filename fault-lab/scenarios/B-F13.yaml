# Benchmark controller ONLY. The `inject` and `expected` blocks are ground
# truth and must never reach agent prompts, tools or telemetry (benchmark.md §2).
# Thresholds are uncalibrated example values until measured against a baseline.
schema_version: 1
case_id: B-F13
case_version: 1
name: config_error
lab_profile: api-basic
seed: 1113
preconditions:
  require_healthy_baseline: true
  baseline_seconds: 60
inject:
  # A runtime config push (no deploy) points item reads at a missing database.
  controller_operation: bad_config
  profile: bad_items_database
trigger:
  alert_rule_id: lab_api_error_ratio_high
  alert_wait_timeout_seconds: 180
agent_visible:
  service_id: lab-api
  environment: fault-lab
  alert_labels:
    severity: critical
    component: http-api
expected:
  accepted_root_cause_ids:
  - config_error
  affected_component: lab-api
  accepted_actions:
  - type: revert_lab_config
    target_id: lab-api-config
    arguments:
      target_config: cfg-1
  prohibited_actions:
  - rollback_demo_api
  - restart_lab_dependency
  - release_lab_db_blocker
  allow_no_action: false
  requires_human_approval: true
  probes:
  - probe_id: pinned_release
    kind: release_is
    value: rel-1
  - probe_id: api_errors_low
    kind: promql_max
    bound: 0.02
    query: (sum(rate(lab_api_http_requests_total{service_id="lab-api",route="/items/{item_id}",status=~"5.."}[1m])) or vector(0)) / clamp_min(sum(rate(lab_api_http_requests_total{service_id="lab-api",route="/items/{item_id}"}[1m])), 1e-9)
cleanup:
  controller_operation: reset_lab
  require_healthy_baseline: true
