[project]
name = "incidentops-fault-lab"
version = "0.1.0"
description = "Disposable, resettable Fault Lab services monitored by IncidentOps."
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiokafka>=0.12",
    "fastapi>=0.115",
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "redis>=5.2",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fault_lab"]
