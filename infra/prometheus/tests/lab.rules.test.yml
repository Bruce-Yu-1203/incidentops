# promtool unit tests for infra/prometheus/rules/lab.rules.yml
rule_files:
  - ../rules/lab.rules.yml

evaluation_interval: 5s

tests:
  - name: kafka lag above threshold for 30s fires
    interval: 5s
    input_series:
      - series: 'kafka_consumergroup_lag{consumergroup="persist-demo-consumer", topic="demo.events.v1", partition="0"}'
        values: "0 100+100x20"
      - series: 'kafka_consumergroup_lag{consumergroup="persist-demo-consumer", topic="demo.events.v1", partition="1"}'
        values: "0x21"
    alert_rule_test:
      - eval_time: 10s
        alertname: lab_kafka_consumer_lag_high
        exp_alerts: []
      - eval_time: 90s
        alertname: lab_kafka_consumer_lag_high
        exp_alerts:
          - exp_labels:
              consumergroup: persist-demo-consumer
              severity: warning
              service_id: persist-demo-consumer
              environment: fault-lab
              component: kafka-consumer
            exp_annotations:
              summary: "persist-demo-consumer group lag above 200 messages"
              observed_value: "1800"

  - name: other consumer groups do not fire
    interval: 5s
    input_series:
      - series: 'kafka_consumergroup_lag{consumergroup="someone-else", topic="t", partition="0"}'
        values: "5000x30"
    alert_rule_test:
      - eval_time: 120s
        alertname: lab_kafka_consumer_lag_high
        exp_alerts: []

  - name: slow item requests fire the latency alert
    interval: 5s
    input_series:
      # All requests land in the 5s bucket: P95 is far above 500ms.
      - series: 'lab_api_http_request_duration_seconds_bucket{route="/items/{item_id}", le="0.5"}'
        values: "0x30"
      - series: 'lab_api_http_request_duration_seconds_bucket{route="/items/{item_id}", le="5.0"}'
        values: "0+50x30"
      - series: 'lab_api_http_request_duration_seconds_bucket{route="/items/{item_id}", le="+Inf"}'
        values: "0+50x30"
    alert_rule_test:
      - eval_time: 120s
        alertname: lab_api_latency_p95_high
        exp_alerts:
          - exp_labels:
              severity: warning
              service_id: lab-api
              environment: fault-lab
              component: http-api
            exp_annotations:
              summary: "lab-api /items P95 latency above 500ms"
              observed_value: "4.775s"

  - name: fast item requests stay quiet
    interval: 5s
    input_series:
      - series: 'lab_api_http_request_duration_seconds_bucket{route="/items/{item_id}", le="0.01"}'
        values: "0+50x30"
      - series: 'lab_api_http_request_duration_seconds_bucket{route="/items/{item_id}", le="+Inf"}'
        values: "0+50x30"
    alert_rule_test:
      - eval_time: 120s
        alertname: lab_api_latency_p95_high
        exp_alerts: []

  - name: high 5xx ratio fires the error alert
    interval: 5s
    input_series:
      - series: 'lab_api_http_requests_total{route="/items/{item_id}", status="200"}'
        values: "0+10x30"
      - series: 'lab_api_http_requests_total{route="/items/{item_id}", status="503"}'
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 120s
        alertname: lab_api_error_ratio_high
        exp_alerts:
          - exp_labels:
              severity: critical
              service_id: lab-api
              environment: fault-lab
              component: http-api
            exp_annotations:
              summary: "lab-api /items 5xx ratio above 5%"
              observed_value: "50%"

  - name: no traffic does not fire the error alert
    interval: 5s
    input_series:
      - series: 'lab_api_http_requests_total{route="/items/{item_id}", status="200"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 120s
        alertname: lab_api_error_ratio_high
        exp_alerts: []

  - name: the error ratio is 0, not missing, before any 5xx response
    interval: 5s
    input_series:
      - series: 'lab_api_http_requests_total{route="/items/{item_id}", status="200"}'
        values: "0+10x30"
    promql_expr_test:
      - expr: lab_api:error_ratio_1m
        eval_time: 120s
        exp_samples:
          - labels: "lab_api:error_ratio_1m"
            value: 0

  - name: memory growth fires after a sustained increase
    interval: 15s
    input_series:
      - series: 'process_resident_memory_bytes{service_id="lab-api"}'
        values: "100000000+30000000x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: lab_api_memory_growth
        exp_alerts:
          - exp_labels:
              severity: warning
              service_id: lab-api
              environment: fault-lab
              component: http-api
            exp_annotations:
              summary: "lab-api resident memory growing faster than 1 MB/s"
              observed_value: "1.907MiB/s"

  - name: memory growth is detected within 90 seconds of a leak starting
    interval: 5s
    input_series:
      # Flat for one minute, then about 2.5 MB/s (a leaky release under load).
      - series: 'process_resident_memory_bytes{service_id="lab-api"}'
        values: "100000000x12 112500000+12500000x40"
    alert_rule_test:
      - eval_time: 55s
        alertname: lab_api_memory_growth
        exp_alerts: []
      - eval_time: 150s
        alertname: lab_api_memory_growth
        exp_alerts:
          - exp_labels:
              severity: warning
              service_id: lab-api
              environment: fault-lab
              component: http-api
            exp_annotations:
              summary: "lab-api resident memory growing faster than 1 MB/s"
              observed_value: "2.384MiB/s"

  - name: stable memory stays quiet
    interval: 15s
    input_series:
      - series: 'process_resident_memory_bytes{service_id="lab-api"}'
        values: "100000000x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: lab_api_memory_growth
        exp_alerts: []

  - name: high cpu fires
    interval: 5s
    input_series:
      - series: 'process_cpu_seconds_total{service_id="lab-api"}'
        values: "0+4x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: lab_api_cpu_high
        exp_alerts:
          - exp_labels:
              severity: warning
              service_id: lab-api
              environment: fault-lab
              component: http-api
            exp_annotations:
              summary: "lab-api process using more than 0.6 CPU cores"
              observed_value: "0.80 cores"

  - name: redis down fires
    interval: 5s
    input_series:
      - series: 'redis_up{service_id="lab-redis"}'
        values: "1 1 0x20"
    alert_rule_test:
      - eval_time: 1m
        alertname: lab_redis_down
        exp_alerts:
          - exp_labels:
              severity: critical
              service_id: lab-redis
              environment: fault-lab
              component: cache
            exp_annotations:
              summary: "lab-redis is not reachable by its exporter"
              observed_value: "0"

  - name: broker invisible to the exporter fires
    interval: 5s
    input_series:
      - series: 'kafka_brokers{service_id="lab-kafka"}'
        values: "1 1 1 0x20"
    alert_rule_test:
      - eval_time: 20s
        alertname: lab_kafka_broker_unreachable
        exp_alerts: []
      - eval_time: 1m
        alertname: lab_kafka_broker_unreachable
        exp_alerts:
          - exp_labels:
              severity: critical
              service_id: lab-kafka
              environment: fault-lab
              component: kafka-broker
            exp_annotations:
              summary: "lab-kafka broker is not visible to the lag exporter"
              observed_value: "0 brokers"

  - name: visible broker stays quiet
    interval: 5s
    input_series:
      - series: 'kafka_brokers{service_id="lab-kafka"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: lab_kafka_broker_unreachable
        exp_alerts: []

  - name: consumer processing at half the produce rate fires
    interval: 5s
    input_series:
      - series: 'lab_producer_messages_sent_total{service_id="demo-producer"}'
        values: "0+100x40"
      - series: 'lab_consumer_messages_processed_total{service_id="persist-demo-consumer"}'
        values: "0+50x40"
    alert_rule_test:
      - eval_time: 3m
        alertname: lab_consumer_processing_slow
        exp_alerts:
          - exp_labels:
              severity: warning
              service_id: persist-demo-consumer
              environment: fault-lab
              component: kafka-consumer
            exp_annotations:
              summary: "persist-demo-consumer processes below 80% of the produce rate"
              observed_value: "10.0 messages/s"

  - name: paused or keeping-up consumers do not fire the slow alert
    interval: 5s
    input_series:
      - series: 'lab_producer_messages_sent_total{service_id="demo-producer"}'
        values: "0+100x40"
      - series: 'lab_consumer_messages_processed_total{service_id="persist-demo-consumer"}'
        values: "0x40"
      - series: 'lab_consumer_messages_processed_total{service_id="other-consumer"}'
        values: "0+100x40"
    alert_rule_test:
      - eval_time: 3m
        alertname: lab_consumer_processing_slow
        exp_alerts: []

  - name: postgres down fires
    interval: 5s
    input_series:
      - series: 'pg_up{service_id="lab-postgres"}'
        values: "1 1 0x20"
    alert_rule_test:
      - eval_time: 1m
        alertname: lab_postgres_down
        exp_alerts:
          - exp_labels:
              severity: critical
              service_id: lab-postgres
              environment: fault-lab
              component: database
            exp_annotations:
              summary: "lab-postgres is not reachable by its exporter"
              observed_value: "0"

  - name: request rate six times its median fires the surge alert
    interval: 15s
    input_series:
      # 10 req/s for 40 minutes, then 60 req/s.
      - series: 'lab_api_http_requests_total{route="/items/{item_id}", status="200"}'
        values: "0+150x160 24900+900x20"
    alert_rule_test:
      - eval_time: 40m
        alertname: lab_api_request_rate_surge
        exp_alerts: []
      - eval_time: 44m
        alertname: lab_api_request_rate_surge
        exp_alerts:
          - exp_labels:
              severity: warning
              service_id: lab-api
              environment: fault-lab
              component: http-api
            exp_annotations:
              summary: "lab-api /items request rate above 3x its 30-minute median"
              observed_value: "60.0 requests/s"

  - name: steady traffic does not fire the surge alert
    interval: 15s
    input_series:
      - series: 'lab_api_http_requests_total{route="/items/{item_id}", status="200"}'
        values: "0+150x180"
    alert_rule_test:
      - eval_time: 44m
        alertname: lab_api_request_rate_surge
        exp_alerts: []

  - name: connections near max_connections fire
    interval: 5s
    input_series:
      - series: 'pg_stat_activity_count{service_id="lab-postgres", state="idle"}'
        values: "2 2 76x20"
      - series: 'pg_stat_activity_count{service_id="lab-postgres", state="active"}'
        values: "1x22"
      - series: 'pg_settings_max_connections{service_id="lab-postgres"}'
        values: "80x22"
    alert_rule_test:
      - eval_time: 1m
        alertname: lab_postgres_connections_near_limit
        exp_alerts:
          - exp_labels:
              severity: critical
              service_id: lab-postgres
              environment: fault-lab
              component: database
            exp_annotations:
              summary: "lab-postgres connections above 90% of max_connections"
              observed_value: "96.25%"
