# Lab alert rules. Labels name the affected service and domain, never the
# injected root cause (benchmark.md §2). `for` windows are initial values to be
# tuned against measured lab baselines.
groups:
  - name: lab-api
    rules:
      - record: lab_api:request_duration_seconds:p95_1m
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(lab_api_http_request_duration_seconds_bucket{route="/items/{item_id}"}[1m])))
      - record: lab_api:error_ratio_1m
        expr: >-
          sum(rate(lab_api_http_requests_total{route="/items/{item_id}", status=~"5.."}[1m]))
          / clamp_min(sum(rate(lab_api_http_requests_total{route="/items/{item_id}"}[1m])), 1e-9)

      - alert: lab_api_latency_p95_high
        expr: lab_api:request_duration_seconds:p95_1m > 0.5
        for: 30s
        labels:
          severity: warning
          service_id: lab-api
          environment: fault-lab
          component: http-api
        annotations:
          summary: "lab-api /items P95 latency above 500ms"
          observed_value: "{{ $value | humanizeDuration }}"

      - alert: lab_api_error_ratio_high
        expr: lab_api:error_ratio_1m > 0.05
        for: 30s
        labels:
          severity: critical
          service_id: lab-api
          environment: fault-lab
          component: http-api
        annotations:
          summary: "lab-api /items 5xx ratio above 5%"
          observed_value: "{{ $value | humanizePercentage }}"

  - name: lab-kafka
    rules:
      - record: lab_kafka:consumergroup_lag:sum
        expr: sum by (consumergroup) (kafka_consumergroup_lag{consumergroup="persist-demo-consumer"})

      - alert: lab_kafka_consumer_lag_high
        expr: lab_kafka:consumergroup_lag:sum > 200
        for: 30s
        labels:
          severity: warning
          service_id: persist-demo-consumer
          environment: fault-lab
          component: kafka-consumer
        annotations:
          summary: "persist-demo-consumer group lag above 200 messages"
          observed_value: "{{ $value }}"
