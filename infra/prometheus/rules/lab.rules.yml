# Lab alert rules. Labels name the affected service and domain, never the
# injected root cause (benchmark.md §2). `for` windows are initial values to be
# tuned against measured lab baselines.
groups:
  - name: lab-api
    rules:
      - record: lab_api:request_duration_seconds:p95_1m
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(lab_api_http_request_duration_seconds_bucket{route="/items/{item_id}"}[1m])))
      - record: lab_api:error_ratio_1m
        # "or vector(0)": with no 5xx series yet the ratio is 0, not "no data".
        expr: >-
          (sum(rate(lab_api_http_requests_total{route="/items/{item_id}", status=~"5.."}[1m])) or vector(0))
          / clamp_min(sum(rate(lab_api_http_requests_total{route="/items/{item_id}"}[1m])), 1e-9)

      - alert: lab_api_latency_p95_high
        expr: lab_api:request_duration_seconds:p95_1m > 0.5
        for: 30s
        labels:
          severity: warning
          service_id: lab-api
          environment: fault-lab
          component: http-api
        annotations:
          summary: "lab-api /items P95 latency above 500ms"
          observed_value: "{{ $value | humanizeDuration }}"

      - alert: lab_api_error_ratio_high
        expr: lab_api:error_ratio_1m > 0.05
        for: 30s
        labels:
          severity: critical
          service_id: lab-api
          environment: fault-lab
          component: http-api
        annotations:
          summary: "lab-api /items 5xx ratio above 5%"
          observed_value: "{{ $value | humanizePercentage }}"

  - name: lab-kafka
    rules:
      - record: lab_kafka:consumergroup_lag:sum
        expr: sum by (consumergroup) (kafka_consumergroup_lag{consumergroup="persist-demo-consumer"})

      - alert: lab_kafka_consumer_lag_high
        expr: lab_kafka:consumergroup_lag:sum > 200
        for: 30s
        labels:
          severity: warning
          service_id: persist-demo-consumer
          environment: fault-lab
          component: kafka-consumer
        annotations:
          summary: "persist-demo-consumer group lag above 200 messages"
          observed_value: "{{ $value }}"

  - name: lab-resources
    rules:
      - alert: lab_api_memory_growth
        expr: deriv(process_resident_memory_bytes{service_id="lab-api"}[2m]) > 1000000
        for: 1m
        labels:
          severity: warning
          service_id: lab-api
          environment: fault-lab
          component: http-api
        annotations:
          summary: "lab-api resident memory growing faster than 1 MB/s"
          observed_value: "{{ $value | humanize1024 }}B/s"

      - alert: lab_api_cpu_high
        expr: rate(process_cpu_seconds_total{service_id="lab-api"}[1m]) > 0.6
        for: 30s
        labels:
          severity: warning
          service_id: lab-api
          environment: fault-lab
          component: http-api
        annotations:
          summary: "lab-api process using more than 0.6 CPU cores"
          observed_value: "{{ $value | printf \"%.2f\" }} cores"

  - name: lab-dependencies
    rules:
      - alert: lab_redis_down
        expr: redis_up{service_id="lab-redis"} == 0
        for: 15s
        labels:
          severity: critical
          service_id: lab-redis
          environment: fault-lab
          component: cache
        annotations:
          summary: "lab-redis is not reachable by its exporter"
          observed_value: "{{ $value }}"
