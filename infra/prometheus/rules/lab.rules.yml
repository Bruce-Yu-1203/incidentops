# Lab alert rules. Labels name the affected service and domain, never the
# injected root cause (benchmark.md §2). `for` windows are initial values to be
# tuned against measured lab baselines.
groups:
  - name: lab-api
    rules:
      - record: lab_api:request_duration_seconds:p95_1m
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(lab_api_http_request_duration_seconds_bucket{route="/items/{item_id}"}[1m])))
      - record: lab_api:error_ratio_1m
        # "or vector(0)": with no 5xx series yet the ratio is 0, not "no data".
        expr: >-
          (sum(rate(lab_api_http_requests_total{route="/items/{item_id}", status=~"5.."}[1m])) or vector(0))
          / clamp_min(sum(rate(lab_api_http_requests_total{route="/items/{item_id}"}[1m])), 1e-9)

      - record: lab_api:request_rate:rate1m
        expr: sum(rate(lab_api_http_requests_total{route="/items/{item_id}"}[1m]))
      # Median of the last 30 minutes: a surge shorter than 15 minutes does not
      # move its own baseline.
      - record: lab_api:request_rate:baseline30m
        expr: quantile_over_time(0.5, lab_api:request_rate:rate1m[30m])

      - alert: lab_api_request_rate_surge
        expr: >-
          lab_api:request_rate:rate1m > 3 * lab_api:request_rate:baseline30m
          and lab_api:request_rate:baseline30m > 1
        for: 30s
        labels:
          severity: warning
          service_id: lab-api
          environment: fault-lab
          component: http-api
        annotations:
          summary: "lab-api /items request rate above 3x its 30-minute median"
          observed_value: "{{ $value | printf \"%.1f\" }} requests/s"

      - alert: lab_api_latency_p95_high
        expr: lab_api:request_duration_seconds:p95_1m > 0.5
        for: 30s
        labels:
          severity: warning
          service_id: lab-api
          environment: fault-lab
          component: http-api
        annotations:
          summary: "lab-api /items P95 latency above 500ms"
          observed_value: "{{ $value | humanizeDuration }}"

      - alert: lab_api_error_ratio_high
        expr: lab_api:error_ratio_1m > 0.05
        for: 30s
        labels:
          severity: critical
          service_id: lab-api
          environment: fault-lab
          component: http-api
        annotations:
          summary: "lab-api /items 5xx ratio above 5%"
          observed_value: "{{ $value | humanizePercentage }}"

  - name: lab-kafka
    rules:
      - record: lab_kafka:consumergroup_lag:sum
        expr: sum by (consumergroup) (kafka_consumergroup_lag{consumergroup="persist-demo-consumer"})

      - alert: lab_kafka_consumer_lag_high
        expr: lab_kafka:consumergroup_lag:sum > 200
        for: 30s
        labels:
          severity: warning
          service_id: persist-demo-consumer
          environment: fault-lab
          component: kafka-consumer
        annotations:
          summary: "persist-demo-consumer group lag above 200 messages"
          observed_value: "{{ $value }}"

      # The lag exporter reaches the broker like every client. When it cannot
      # reach the broker its scrape times out, so kafka_brokers goes absent
      # instead of dropping to 0; absence counts as 0 visible brokers.
      - alert: lab_kafka_broker_unreachable
        expr: >-
          (max(kafka_brokers{service_id="lab-kafka"}) < 1)
          or (absent(kafka_brokers{service_id="lab-kafka"}) * 0)
        for: 15s
        labels:
          severity: critical
          service_id: lab-kafka
          environment: fault-lab
          component: kafka-broker
        annotations:
          summary: "lab-kafka broker is not visible to the lag exporter"
          observed_value: "{{ $value }} brokers"

      - record: lab_consumer:processed_per_second:rate1m
        expr: sum(rate(lab_consumer_messages_processed_total{service_id="persist-demo-consumer"}[1m]))
      - record: lab_producer:sent_per_second:rate1m
        expr: sum(rate(lab_producer_messages_sent_total{service_id="demo-producer"}[1m]))

      # Processing but falling behind; a stopped (0/s) consumer is left to the
      # lag alert.
      - alert: lab_consumer_processing_slow
        expr: >-
          lab_consumer:processed_per_second:rate1m > 0
          and lab_consumer:processed_per_second:rate1m < 0.8 * lab_producer:sent_per_second:rate1m
        for: 1m
        labels:
          severity: warning
          service_id: persist-demo-consumer
          environment: fault-lab
          component: kafka-consumer
        annotations:
          summary: "persist-demo-consumer processes below 80% of the produce rate"
          observed_value: "{{ $value | printf \"%.1f\" }} messages/s"

  - name: lab-resources
    rules:
      # Growth rate rather than level: a leak that stops at a cap is still
      # visible as a growth burst within the investigation lookback.
      - record: lab_api:memory_growth_bytes_per_second:deriv1m
        expr: deriv(process_resident_memory_bytes{service_id="lab-api"}[1m])

      - alert: lab_api_memory_growth
        expr: lab_api:memory_growth_bytes_per_second:deriv1m > 1000000
        for: 30s
        labels:
          severity: warning
          service_id: lab-api
          environment: fault-lab
          component: http-api
        annotations:
          summary: "lab-api resident memory growing faster than 1 MB/s"
          observed_value: "{{ $value | humanize1024 }}B/s"

      - alert: lab_api_cpu_high
        expr: rate(process_cpu_seconds_total{service_id="lab-api"}[1m]) > 0.6
        for: 30s
        labels:
          severity: warning
          service_id: lab-api
          environment: fault-lab
          component: http-api
        annotations:
          summary: "lab-api process using more than 0.6 CPU cores"
          observed_value: "{{ $value | printf \"%.2f\" }} cores"

  - name: lab-dependencies
    rules:
      - alert: lab_redis_down
        expr: redis_up{service_id="lab-redis"} == 0
        for: 15s
        labels:
          severity: critical
          service_id: lab-redis
          environment: fault-lab
          component: cache
        annotations:
          summary: "lab-redis is not reachable by its exporter"
          observed_value: "{{ $value }}"

      - alert: lab_postgres_down
        expr: pg_up{service_id="lab-postgres"} == 0
        for: 15s
        labels:
          severity: critical
          service_id: lab-postgres
          environment: fault-lab
          component: database
        annotations:
          summary: "lab-postgres is not reachable by its exporter"
          observed_value: "{{ $value }}"

      - alert: lab_postgres_connections_near_limit
        expr: >-
          sum(pg_stat_activity_count{service_id="lab-postgres"})
          / clamp_min(max(pg_settings_max_connections{service_id="lab-postgres"}), 1) > 0.9
        for: 15s
        labels:
          severity: critical
          service_id: lab-postgres
          environment: fault-lab
          component: database
        annotations:
          summary: "lab-postgres connections above 90% of max_connections"
          observed_value: "{{ $value | humanizePercentage }}"
