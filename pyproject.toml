[project]
name = "incidentops"
version = "0.1.0"
description = "Reliable, observable, policy-governed AI SRE runtime (lab prototype)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["incidentops"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "PT", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert statements and hard-coded fake secrets.
"tests/**" = ["S101", "S105", "S106", "PT012"]
"fault-lab/tests/**" = ["S101", "S105", "S106"]
# Autogenerated migrations embed long SQL literals.
"incidentops/persistence/migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["incidentops", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette 1.x nudges toward httpx2; harmless for in-process tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: requires real backing services such as PostgreSQL",
]
