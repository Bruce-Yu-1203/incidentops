[project]
name = "incidentops"
version = "0.1.0"
description = "Reliable, observable, policy-governed AI SRE runtime (lab prototype)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.14",
    "anthropic>=0.60",
    "fastapi>=0.115",
    "httpx>=0.28",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "incidentops-fault-lab",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv.workspace]
members = ["fault-lab"]

[tool.uv.sources]
incidentops-fault-lab = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["incidentops"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "PT", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert statements and hard-coded fake secrets.
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "PT012"]
"fault-lab/tests/**" = ["S101", "S105", "S106"]
# Live e2e checks drive the lab with the synchronous benchmark client.
"tests/e2e/**" = ["S101", "S105", "S106", "S603", "S607", "PT012", "ASYNC212", "ASYNC210"]
# Autogenerated migrations embed long SQL literals.
"incidentops/persistence/migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["incidentops", "tests", "scripts", "fault-lab/fault_lab", "fault-lab/tests"]

[[tool.mypy.overrides]]
# aiokafka ships no type information.
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "fault-lab/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette 1.x nudges toward httpx2; harmless for in-process tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: requires real backing services such as PostgreSQL",
    "lab: requires the running Fault Lab (make lab-up)",
]
